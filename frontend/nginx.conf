server {
  listen 80;
  # Redirects say "/login", not "http://localhost/login": nginx only knows its container port (80), not the
  # one the browser used (8080, or 443 behind a proxy)
  absolute_redirect off;

  # Re-resolve service names through Docker's internal DNS instead of once at startup.
  # Without this nginx caches each container's IP forever, so after `docker compose up --build`
  # recreates a backend (new IP) the dashboard gets 502 until the frontend is restarted too.
  # Putting the upstream in a variable is what makes nginx honour the resolver per request.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Behind a proxy on this Docker network (Caddy on a server, see docker-compose.server.yml) every request comes
  # from the proxy's address. Take the client's from X-Forwarded-For when it was set by a private (Docker or
  # localhost) address, so the sign-in limits count per real client, not all clients as one.
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 192.168.0.0/16;
  set_real_ip_from 127.0.0.1;
  real_ip_header X-Forwarded-For;
  real_ip_recursive on;
  set $backtest http://backtest-service:8000;
  set $trading http://trading-service:8000;

  # --- Sign-in gate -----------------------------------------------------------------------------
  # Every location with `auth_request /_auth` first asks trading-service "is this browser signed in?"
  # (it checks the session cookie, see trading-service/app/auth.py). 2xx lets the request through, 401 is
  # returned to the browser, and anything else (trading-service down) is a 500: closed, never open.
  location = /_auth {
    internal;
    proxy_pass $trading/auth/check;
    proxy_pass_request_body off;      # the check only needs the cookie
    proxy_set_header Content-Length "";
  }

  # Sign-in, sign-up, sign-out, and the admin's account management: open, trading-service checks them itself
  # /api/auth/login  ->  http://trading-service:8000/auth/login
  location /api/auth/ {
    rewrite ^/api/auth/(.*)$ /auth/$1 break;
    proxy_pass $trading;
    proxy_set_header X-Real-IP $remote_addr;   # the failed-sign-in limit counts per address
  }

  # WebSocket for live run monitoring -> backtest-service (needs the upgrade headers)
  location /ws/ {
    auth_request /_auth;
    proxy_pass $backtest;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_read_timeout 3600s;         # long-lived connection for the whole backtest
  }

  # REST API -> backtest-service (matches /runs and /runs/{id})
  location /runs {
    auth_request /_auth;
    proxy_pass $backtest;
  }
  location /scans {                   # /scans, /scans/{id}, /scans/{id}/stop
    auth_request /_auth;
    proxy_pass $backtest;
  }
  location /health {
    proxy_pass $backtest;
  }

  # Trading API -> trading-service, with the prefix stripped:
  # /api/trading/bots?x=1  ->  http://trading-service:8000/bots?x=1  (rewrite keeps the query string)
  location /api/trading/ {
    auth_request /_auth;
    rewrite ^/api/trading/(.*)$ /$1 break;
    proxy_pass $trading;
    proxy_read_timeout 180s;          # "Run now" (news RAG + LLM explanation) can take a while
  }

  # The guides (static pages shown in the app, or opened in their own tab): signed-in only.
  # Signed out, a direct link lands on the sign-in page instead of a bare 401.
  location /guides/ {
    auth_request /_auth;
    error_page 401 = @signin;
    root /usr/share/nginx/html;
  }
  location @signin {
    return 302 /login;
  }

  # Everything else is the React single-page app. Its code is public (the sign-in page is part of it);
  # the data it shows all comes through the gated locations above.
  # index.html names the current build's bundle, so browsers must re-check it on every load (a cheap 304 when
  # unchanged); otherwise they keep running the old app after a rebuild until a hard refresh.
  location / {
    root /usr/share/nginx/html;
    try_files $uri /index.html;       # SPA fallback
    add_header Cache-Control "no-cache" always;
  }

  # Built assets have a content hash in their name (index-<hash>.js): a new build gets new names, so these
  # can be cached for good.
  location /assets/ {
    root /usr/share/nginx/html;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }
}
