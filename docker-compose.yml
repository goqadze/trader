# Every published port is bound to 127.0.0.1, so only this machine can reach it. That matters most on a
# server: Docker's published ports bypass the Linux firewall (ufw), and only the dashboard (8080) has a sign-in;
# the APIs, databases and monitoring tools behind it have none of their own.
# From another machine, use an SSH tunnel or Tailscale (see DEPLOY.md).
# `restart: unless-stopped` everywhere: after a crash, a Docker restart or a reboot, the stack comes back
# by itself (unless you stopped it with `docker compose stop/down`).

services:
  # The decision-support API (FastAPI + LangGraph agent)
  decision-service:
    build: ./decision-service          # build the image from decision-service/Dockerfile
    ports:
      - "127.0.0.1:8000:8000"          # host:container; localhost only (it spends OpenAI credits)
    env_file:
      - ./decision-service/.env        # API keys (OpenAI, Alpaca, ...) + monitoring config
    volumes:
      - ./decision-service/app:/code/app   # live code reload in dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload   # --reload restarts on code changes
    depends_on:
      news-db:
        condition: service_healthy     # the news store must accept connections before the first signal
    restart: unless-stopped            # bots need it for every decision, so it must come back on its own

  # News vector store for the RAG layer: Postgres with the pgvector extension, owned by decision-service.
  # Separate from trading-db, so news ingestion can never lock or fill up the trading history.
  news-db:
    image: pgvector/pgvector:pg16      # official postgres:16 image + the pgvector extension
    environment:
      POSTGRES_USER: news
      POSTGRES_PASSWORD: news            # local-only dev credentials; the port is bound to localhost
      POSTGRES_DB: news
    ports:
      - "127.0.0.1:5434:5432"          # inspect with any SQL client: localhost:5434 news/news
    volumes:
      - news-db:/var/lib/postgresql/data  # a cache: safe to delete, news is re-fetched on the next decision
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U news -d news"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # The backtest engine API (FastAPI + WebSocket)
  backtest-service:
    build: ./backtest-service
    ports:
      - "127.0.0.1:8001:8000"          # API/docs at http://localhost:8001/docs
    env_file:
      - ./backtest-service/.env        # DECISION_SERVICE_URL + optional SENTRY_DSN
    volumes:
      - ./backtest-service/app:/code/app       # live code reload in dev
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    depends_on:
      - decision-service               # start decision-service first
    restart: unless-stopped

  # Trading history database (bots, decisions, orders, equity, audit log).
  # Its own Postgres, separate from Langfuse's, so monitoring can't touch trading data.
  trading-db:
    image: postgres:16
    environment:
      POSTGRES_USER: trading
      POSTGRES_PASSWORD: trading           # local-only dev credentials; the port is bound to localhost
      POSTGRES_DB: trading
    ports:
      - "127.0.0.1:5433:5432"            # inspect with any SQL client: localhost:5433 trading/trading (5433 avoids a local Postgres)
    volumes:
      - trading-db:/var/lib/postgresql/data  # survives restarts, rebuilds and `docker compose down` (not `down -v`)
    healthcheck:                          # trading-service waits until Postgres actually accepts connections
      test: ["CMD-SHELL", "pg_isready -U trading -d trading"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  # Live/paper trading bots: scheduler + broker adapters; history lives in trading-db
  trading-service:
    build: ./trading-service
    ports:
      - "127.0.0.1:8002:8000"          # API/docs at http://localhost:8002/docs (localhost only: it can place orders)
    env_file:
      - ./trading-service/.env         # DATABASE_URL, broker keys, ALLOW_LIVE_TRADING, scheduler timing
    volumes:
      - ./trading-service/app:/code/app    # live code reload in dev
    # --reload for dev; still ONE process, so the scheduler never runs twice
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    restart: unless-stopped            # bots keep running after a crash or a Docker restart
    depends_on:
      decision-service:
        condition: service_started
      trading-db:
        condition: service_healthy     # don't start the scheduler before the database is ready

  # React + Ant Design dashboard, served by nginx which proxies the backtest and trading APIs
  frontend:
    build: ./frontend
    ports:
      - "127.0.0.1:8080:80"            # http://localhost:8080 -- localhost only, since it can control trading bots
    depends_on:
      - backtest-service
      - trading-service                # nginx refuses to start if a proxied host doesn't exist yet
    restart: unless-stopped

  # ------------------------------------------------------------------
  # Monitoring (all local, all free)
  # ------------------------------------------------------------------

  # Langfuse: LLM tracing UI at http://localhost:3000  (login admin@local.dev / langfuse123)
  langfuse-db:
    image: postgres:16
    environment:
      POSTGRES_USER: langfuse
      POSTGRES_PASSWORD: langfuse
      POSTGRES_DB: langfuse
    volumes:
      - langfuse-db:/var/lib/postgresql/data
    restart: unless-stopped

  langfuse:
    image: langfuse/langfuse:2      # v2 is light: needs only Postgres
    depends_on:
      - langfuse-db
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      DATABASE_URL: postgresql://langfuse:langfuse@langfuse-db:5432/langfuse
      NEXTAUTH_URL: http://localhost:3000
      NEXTAUTH_SECRET: local-dev-secret-change-me
      SALT: local-dev-salt-change-me
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      TELEMETRY_ENABLED: "false"
      # Headless bootstrap: creates the org/project/user and fixes the API keys on first boot,
      # so decision-service can send traces immediately (keys are in decision-service/.env).
      LANGFUSE_INIT_ORG_ID: trading
      LANGFUSE_INIT_ORG_NAME: Trading
      LANGFUSE_INIT_PROJECT_ID: trading
      LANGFUSE_INIT_PROJECT_NAME: Trading
      LANGFUSE_INIT_PROJECT_PUBLIC_KEY: pk-lf-local-dev
      LANGFUSE_INIT_PROJECT_SECRET_KEY: sk-lf-local-dev
      LANGFUSE_INIT_USER_EMAIL: admin@local.dev
      LANGFUSE_INIT_USER_NAME: Admin
      LANGFUSE_INIT_USER_PASSWORD: langfuse123
    restart: unless-stopped

  # GlitchTip: error tracking (Sentry-API compatible) at http://localhost:8082
  glitchtip-db:
    image: postgres:16
    environment:
      POSTGRES_USER: glitchtip
      POSTGRES_PASSWORD: glitchtip
      POSTGRES_DB: glitchtip
    volumes:
      - glitchtip-db:/var/lib/postgresql/data
    restart: unless-stopped

  glitchtip-redis:
    image: redis:7
    restart: unless-stopped

  glitchtip-web:
    image: glitchtip/glitchtip
    depends_on:
      - glitchtip-db
      - glitchtip-redis
    ports:
      - "127.0.0.1:8082:8080"
    environment: &glitchtip-env
      DATABASE_URL: postgres://glitchtip:glitchtip@glitchtip-db:5432/glitchtip
      SECRET_KEY: local-dev-secret-change-me
      REDIS_URL: redis://glitchtip-redis:6379/0
      PORT: "8080"
      EMAIL_URL: consolemail://              # no SMTP needed; emails go to the console
      GLITCHTIP_DOMAIN: http://localhost:8082
      DEFAULT_FROM_EMAIL: admin@local.dev
      ENABLE_OPEN_USER_REGISTRATION: "true"  # so you can sign up the first user in the UI
      CELERY_WORKER_AUTOSCALE: "1,3"
    restart: unless-stopped

  glitchtip-worker:
    image: glitchtip/glitchtip
    depends_on:
      - glitchtip-db
      - glitchtip-redis
    command: ./bin/run-celery-with-beat.sh
    environment: *glitchtip-env
    restart: unless-stopped

  glitchtip-migrate:
    image: glitchtip/glitchtip
    depends_on:
      - glitchtip-db
    command: ./manage.py migrate
    environment: *glitchtip-env
    restart: on-failure                       # retries until the DB is ready, then exits

  # ------------------------------------------------------------------
  # Database browser
  # ------------------------------------------------------------------

  # pgAdmin: browse tables and data at http://localhost:5050 (no login: localhost only, like the databases).
  # trading-db and news-db are already connected (pgadmin/servers.json, passwords from pgadmin/pgpass).
  # It can also change and delete data, so look before you run anything that writes.
  pgadmin:
    image: dpage/pgadmin4:9
    ports:
      - "127.0.0.1:5050:80"
    environment:
      PGADMIN_CONFIG_SERVER_MODE: "False"               # desktop mode: no pgAdmin login of its own
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"  # don't ask for a master password to use saved passwords
      PGADMIN_DEFAULT_EMAIL: admin@local.dev            # required by the image even in desktop mode; unused
      PGADMIN_DEFAULT_PASSWORD: pgadmin
      PGADMIN_REPLACE_SERVERS_ON_STARTUP: "True"        # re-read servers.json at every start, so edits apply
      PGPASS_FILE: /pgadmin4/pgpass                     # copied into place on first start (see servers.json PassFile)
      PGADMIN_DISABLE_POSTFIX: "true"                   # no password-reset emails needed
    volumes:
      - ./pgadmin/servers.json:/pgadmin4/servers.json:ro
      - ./pgadmin/pgpass:/pgadmin4/pgpass:ro
      - pgadmin:/var/lib/pgadmin                        # query history and UI state
    depends_on:
      - trading-db
      - news-db
    restart: unless-stopped

# Named volumes managed by Docker (persist data between runs)
volumes:
  news-db:
  trading-db:
  langfuse-db:
  glitchtip-db:
  pgadmin:
